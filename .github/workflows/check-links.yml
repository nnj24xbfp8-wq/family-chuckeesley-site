name: Check internal links

# Body markdown links (/family/…, /docs/…, /archive/…, /places/…) are not
# validated by the Astro build. This workflow runs the standalone checker so a
# broken internal link fails CI instead of shipping silently.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # matches the "node": "22.x" engines pin in package.json
      # The checker is pure Node with no dependencies, so no install step is needed.
      - name: Check internal links
        run: node scripts/check-links.mjs
